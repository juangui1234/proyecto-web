<!DOCTYPE html>
<html lang="spanish">

<head>
    <link rel="stylesheet" href="estilos.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Graduate&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Permanent+Marker&display=swap"
        rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="contenedor_login">
    <div class="formulario">
        <form class="form" id="form_login">
            <h1 class="titulo_login">Iniciar sesión</h1>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" autocomplete="name" required>

            <label for="correo">Correo:</label>
            <input type="email" id="correo" name="correo" autocomplete="email" required>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>

            <label for="carrera">Carrera:</label>
            <select id="carrera" name="carrera" required>
                <option value="">Seleccionar carrera</option>
                <option value="Ingenieria">Ingenieria</option>
                <option value="Medicina">Medicina</option>
                <option value="Economia">Economia</option>
                <option value="Derecho">Derecho</option>
                <option value="Diseño">Diseño</option>
                <option value="Ambientales">Ambientales</option>
            </select>

            <p class="parrafo_login"> No tienes una cuenta? <a href="registro.html">Regístrate aquí</a></p>
            <button id="boton_login" type="submit">Ingresar</button>
            <button id="boton_usuarios" type="button" aria-controls="panel_usuarios">Usuarios</button>
        </form>
        <section id="panel_usuarios" class="panel_usuarios" aria-label="Lista de usuarios" hidden>
            <p id="estado_usuarios" class="estado_usuarios" role="status" aria-live="polite"></p>
            <ul id="lista_usuarios" class="lista_usuarios"></ul>
        </section>
    </div>
    <div class="logo_inicio_sesion">
 <img class="img_inicio_sesion" src="img/logo_inicio_sesion.jpeg"/>
    </div>
    </div>
    <script src="js/login.js"></script>
    <script src="js/loginNode.js"></script>
</body>
</html>

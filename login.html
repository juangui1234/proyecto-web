<body>
    <div class="contenedor_login">
    <div class="formulario">
        <form class="form" action="/login">
            <h1 class="titulo_login">Iniciar sesión</h1>
            <label for="correo">Correo:</label>
            <input type="email" id="correo" name="correo" required>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required>
            <p class="parrafo_login"> No tienes una cuenta? <a href="registro.html">Regístrate aquí</a></p>
            <button type="submit">Ingresar</button>
        </form>
    </div>
    <div class="logo_inicio_sesion">
 <img class="img_inicio_sesion" src="img/logo_inicio_sesion.jpeg"/>
    </div>
    </div>
